<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizzou Football Trivia & Word Search</title>
    <style>
        :root {
            --gold: #F1B82D;
            --black: #000000;
            --dark-gray: #1a1a1a;
            --light-gray: #f4f4f4;
            --mid-gray: #e0e0e0;
            --text-color: #333333;
            --correct-green: #2e7d32;
            --wrong-red: #c62828;
            --highlight-yellow: #fff59d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light-gray);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--black);
            color: var(--gold);
            padding: 1rem 2rem;
            text-align: center;
            border-bottom: 4px solid var(--gold);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: #ffffff;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .container {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            width: 100%;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 1.25rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--mid-gray);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            border-bottom: 2px solid var(--gold);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--black);
            text-transform: uppercase;
        }

        /* Article Styles */
        .article-content {
            font-size: 0.95rem;
            line-height: 1.6;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .article-content p {
            margin-bottom: 1rem;
        }

        .article-highlight {
            background-color: var(--highlight-yellow);
            font-weight: bold;
            padding: 0 2px;
            border-radius: 2px;
        }

        .source-tag {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.5rem;
            font-style: italic;
        }

        /* Word List Styles */
        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .word-item {
            background-color: var(--light-gray);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid var(--mid-gray);
            user-select: none;
            transition: all 0.2s ease;
        }

        .word-item.found {
            background-color: var(--correct-green);
            color: #ffffff;
            text-decoration: line-through;
            border-color: var(--correct-green);
        }

        /* Word Search Grid Styles */
        .grid-container {
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: none;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            gap: 2px;
            background-color: var(--dark-gray);
            padding: 4px;
            border-radius: 4px;
        }

        .cell {
            width: 32px;
            height: 32px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.15s;
        }

        @media (max-width: 400px) {
            .cell {
                width: 26px;
                height: 26px;
                font-size: 0.85rem;
            }
        }

        .cell.selecting {
            background-color: var(--gold);
            color: var(--black);
        }

        .cell.found-cell {
            background-color: #bbdefb;
            color: #0d47a1;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background-color: var(--black);
            color: var(--gold);
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: #ffffff;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-top: 6px solid var(--gold);
        }

        .modal h2 {
            margin-bottom: 0.75rem;
            color: var(--black);
        }

        .modal p {
            margin-bottom: 1.25rem;
            line-height: 1.5;
        }

        .modal-options {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

            padding: 0.75rem 1rem;
            border:
